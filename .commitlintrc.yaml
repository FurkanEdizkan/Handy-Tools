extends:
  - "@commitlint/config-conventional"

rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
  # Warning-level only: an unlisted scope doesn't block a PR, it just nudges
  # toward the shared vocabulary. Keep in sync with CONTRIBUTING.md.
  scope-enum:
    - 1
    - always
    - - image
      - archive
      - pdf
      - hash
      - rename
      - difftree
      - stripmeta
      - tools
      - progress
      - cli
      - handy
      - server
      - api
      - mcp
      - queue
      - proto
      - config
      - web
      - gui
      - install
      - buildinfo
      - build
      - ci
      - release
      - deps
      - docs
      - test
      - lint
  subject-case:
    - 2
    - never
    - - upper-case
      - pascal-case
      - start-case
  header-max-length:
    - 2
    - always
    - 100
  body-max-line-length:
    - 1
    - always
    - 120
