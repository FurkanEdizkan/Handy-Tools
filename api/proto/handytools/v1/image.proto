syntax = "proto3";

package handytools.v1;

import "handytools/v1/common.proto";

option go_package = "github.com/furkandedizkan/handy-tools/gen/handytools/v1;handytoolsv1";

enum ImageFormat {
  IMAGE_FORMAT_UNSPECIFIED = 0;
  IMAGE_FORMAT_PNG = 1;
  IMAGE_FORMAT_JPEG = 2;
  IMAGE_FORMAT_GIF = 3;
  IMAGE_FORMAT_BMP = 4;
  IMAGE_FORMAT_TIFF = 5;
  IMAGE_FORMAT_WEBP = 6;
  IMAGE_FORMAT_HEIC = 7;   // requires system "magick"
}

message ImageOptions {
  // 1..100. Honored by lossy formats (jpeg, webp); ignored otherwise.
  int32 quality = 1;
  // Optional resize. 0 means "keep this dimension".
  int32 max_width = 2;
  int32 max_height = 3;
  // Strip EXIF / metadata.
  bool strip_metadata = 4;
}

service ImageService {
  rpc Convert(ConvertRequest) returns (stream Progress);
  rpc BatchConvert(BatchConvertRequest) returns (stream Progress);
  // Preview renders a single downscaled thumbnail of an image. Unlike
  // Convert it writes nothing to disk and returns the encoded bytes inline,
  // so the web gallery can show a thumbnail without a round trip through
  // the filesystem. (Phase 5 / #59 — handlers land later.)
  rpc Preview(ImagePreviewRequest) returns (ImagePreviewResponse);
}

message ConvertRequest {
  FileRef source = 1;
  ImageFormat target_format = 2;
  ImageOptions options = 3;
  OutputLocation output = 4;
}

message BatchConvertRequest {
  repeated FileRef sources = 1;
  ImageFormat target_format = 2;
  ImageOptions options = 3;
  OutputLocation output = 4;
}

message ImagePreviewRequest {
  FileRef source = 1;
  // Bounding box for the thumbnail. 0 means "unconstrained on this axis";
  // the image is scaled down to fit, never up.
  int32 max_width = 2;
  int32 max_height = 3;
  // Encoding for the returned bytes. IMAGE_FORMAT_UNSPECIFIED lets the
  // server pick a sensible default (currently PNG).
  ImageFormat format = 4;
}

message ImagePreviewResponse {
  bytes image = 1;          // encoded thumbnail bytes
  int32 width = 2;          // actual width of the returned thumbnail
  int32 height = 3;         // actual height of the returned thumbnail
  ImageFormat format = 4;   // encoding actually used for `image`
}
