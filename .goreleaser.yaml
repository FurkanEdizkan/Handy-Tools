version: 2

project_name: handy-tools

before:
  hooks:
    - sh -c "buf generate"
    - go mod tidy

builds:
  - id: htools
    main: ./cmd/htools
    binary: htools
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Version={{.Version}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Date={{.Date}}

  - id: htoolsd
    main: ./cmd/htoolsd
    binary: htoolsd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Version={{.Version}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/**/*

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # Parse commit messages between the previous tag and this one. With the
  # calver tagging scheme each push to main becomes its own release, so a
  # release typically contains a single commit — but multi-commit pushes
  # are still grouped correctly under Changes / Fixes / Other.
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^ci"
  groups:
    - title: Changes
      regexp: "^.*feat(\\(.+\\))?!?:"
      order: 0
    - title: Fixes
      regexp: "^.*fix(\\(.+\\))?!?:"
      order: 1
    - title: Other
      order: 999

release:
  # Owner/name are auto-detected from `git remote -v` at release time.
  # Don't hardcode them: a lowercase mismatch against the canonical
  # FurkanEdizkan/Handy-Tools casing previously caused the publish step
  # to 404 even though the build itself was fine.
  #
  # `auto` marks the release as prerelease when the version contains a
  # prerelease suffix (e.g. `-beta.3`). Every calver release fits, so
  # every release ships as Pre-release on GitHub.
  prerelease: auto
  draft: false
  # Friendly release title matching the calver style:
  #   "Handy Tools 2026.5.14-beta.1"
  name_template: "Handy Tools {{ .Version }}"
  header: |
    Calver pre-release built from `{{ .ShortCommit }}` on `{{ .Date }}`.
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/FurkanEdizkan/Handy-Tools/main/install.sh | sh
    ```

    Or pick the archive for your OS/arch from the assets below, extract, and put `htools` and `htoolsd` on your PATH. Each release also includes a `*_source.tar.gz` and `checksums.txt`.

    See [README](https://github.com/FurkanEdizkan/Handy-Tools#readme) for system dependency hints.

    ## Versioning

    Handy Tools tags every CI-green commit on `main` as `v{YYYY}.{M}.{D}-beta.{N}` (UTC date + per-day counter). The scheme is intentionally pre-release while the project is pre-1.0; once we cut a `v1.0.0`, releases will switch back to semver.
