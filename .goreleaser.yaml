version: 2

project_name: handy-tools

before:
  hooks:
    - sh -c "buf generate"
    - go mod tidy

builds:
  - id: htools
    main: ./cmd/htools
    binary: htools
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Version={{.Version}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Date={{.Date}}

  - id: htoolsd
    main: ./cmd/htoolsd
    binary: htoolsd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Version={{.Version}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/**/*

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^ci"
  groups:
    - title: Features
      regexp: "^.*feat(\\(.+\\))?!?:"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix(\\(.+\\))?!?:"
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: furkandedizkan
    name: handy-tools
  prerelease: auto
  draft: false
  name_template: "v{{ .Version }}"
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/furkandedizkan/handy-tools/main/install.sh | sh
    ```

    Or pick the archive for your OS/arch from the assets below, extract, and put `htools` and `htoolsd` on your PATH. Each release also includes a `*_source.tar.gz` and `checksums.txt`.

    See [README](https://github.com/furkandedizkan/handy-tools#readme) for system dependency hints.
