version: 2

project_name: handy-tools

before:
  hooks:
    - sh -c "buf generate"
    - go mod tidy
    # Build the Svelte frontend so htoolsd and htools-gui embed the real SPA
    # (web/webfs.go go:embed) instead of the committed placeholder.
    - sh -c "cd web && npm ci && npm run build"

builds:
  - id: handy
    main: ./cmd/handy
    binary: handy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Version={{.Version}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Date={{.Date}}

  - id: htools
    main: ./cmd/htools
    binary: htools
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Version={{.Version}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Date={{.Date}}

  - id: htoolsd
    main: ./cmd/htoolsd
    binary: htoolsd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Version={{.Version}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Date={{.Date}}

  - id: htools-mcp
    main: ./cmd/htools-mcp
    binary: htools-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Version={{.Version}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/furkandedizkan/handy-tools/internal/buildinfo.Date={{.Date}}

  # The Wails desktop app. Unlike htools/htoolsd it needs CGO + the webkit2gtk
  # toolchain, so it cannot be cross-compiled: it ships linux/amd64 only,
  # built natively on the release runner (release.yml installs both webkit
  # ABIs and pins ubuntu-22.04). darwin/arm64 desktop builds need a macOS
  # runner and are a post-1.0 follow-up. The `wails` tag selects the real
  # app over the CGO-free stub (see cmd/htools-gui).
  #
  # We build htools-gui twice — once per webkit2gtk ABI — because the two
  # are not source-compatible at runtime (libwebkit2gtk-4.0.so.37 vs
  # libwebkit2gtk-4.1.so.0). Ubuntu 22.04 / Debian 12 have only 4.0;
  # Ubuntu 24.04+ has only 4.1; install.sh picks the matching tarball
  # based on what ldconfig reports.
  - id: htools-gui-webkit40
    main: ./cmd/htools-gui
    binary: htools-gui
    env:
      - CGO_ENABLED=1
    goos: [linux]
    goarch: [amd64]
    # `wails` selects the real app over the CGO-free stub; `production` is
    # required by Wails itself — without it the binary aborts at startup with
    # "will not build without the correct build tags". No `webkit2_41` tag
    # here → CGO links against libwebkit2gtk-4.0.so.37.
    tags:
      - wails
      - production
    ldflags:
      - -s -w

  - id: htools-gui-webkit41
    main: ./cmd/htools-gui
    binary: htools-gui
    env:
      - CGO_ENABLED=1
    goos: [linux]
    goarch: [amd64]
    # `webkit2_41` flips cmd/htools-gui's CGO bindings to the 4.1 ABI —
    # CGO then links against libwebkit2gtk-4.1.so.0 for Ubuntu 24.04+.
    tags:
      - wails
      - production
      - webkit2_41
    ldflags:
      - -s -w

archives:
  # htools + htoolsd ship on every linux/darwin × amd64/arch64 platform, so
  # they go in the default archive. htools-gui is linux/amd64-only (CGO +
  # webkit), so it gets its own archive — GoReleaser rejects a single archive
  # whose binary count differs across platforms.
  - id: default
    ids:
      - handy
      - htools
      - htoolsd
      - htools-mcp
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/**/*

  # Legacy GUI archive (webkit2gtk-4.0 ABI) — kept under its original
  # name so older install.sh versions and existing user automation keep
  # working on Ubuntu 22.04 / Debian 12.
  - id: gui-webkit40
    ids:
      - htools-gui-webkit40
    name_template: "{{ .ProjectName }}-gui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

  # New GUI archive (webkit2gtk-4.1 ABI) — install.sh on Ubuntu 24.04+
  # picks this one based on `ldconfig -p`. Same internal binary name,
  # different ABI.
  - id: gui-webkit41
    ids:
      - htools-gui-webkit41
    name_template: "{{ .ProjectName }}-gui-webkit41_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # Parse commit messages between the previous tag and this one. PRs merge
  # as merge commits (no squash), so a test -> main promotion brings every
  # feature commit onto main; they are grouped under Changes / Fixes / Other.
  # The merge commits themselves ("Merge pull request …" / "Merge branch …")
  # are filtered out so only the real commits show.
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^ci"
      - "^Merge "
  groups:
    - title: Changes
      regexp: "^.*feat(\\(.+\\))?!?:"
      order: 0
    - title: Fixes
      regexp: "^.*fix(\\(.+\\))?!?:"
      order: 1
    - title: Other
      order: 999

release:
  # Owner/name are auto-detected from `git remote -v` at release time.
  # Don't hardcode them: a lowercase mismatch against the canonical
  # FurkanEdizkan/Handy-Tools casing previously caused the publish step
  # to 404 even though the build itself was fine.
  #
  # `auto` marks the release as prerelease when the version contains a
  # prerelease suffix (e.g. `-beta.3`). Every calver release fits, so
  # every release ships as Pre-release on GitHub.
  prerelease: auto
  draft: false
  # Friendly release title matching the calver style:
  #   "Handy Tools 2026.5.14-beta.1"
  name_template: "Handy Tools {{ .Version }}"
  header: |
    Calver pre-release built from `{{ .ShortCommit }}` on `{{ .Date }}`.
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/FurkanEdizkan/Handy-Tools/main/install.sh | sh
    ```

    Or pick the archive for your OS/arch from the assets below, extract, and put `handy`, `htools`, `htoolsd`, and `htools-mcp` on your PATH. (`handy` is the user-facing front door — bare `handy` opens the desktop app and `handy <verb>` dispatches to the others.) Each release also includes a `*_source.tar.gz` and `checksums.txt`.

    See [README](https://github.com/FurkanEdizkan/Handy-Tools#readme) for system dependency hints.

    ## Versioning

    Handy Tools tags every CI-green commit on `main` as `v{YYYY}.{M}.{D}-beta.{N}` (UTC date + per-day counter). The scheme is intentionally pre-release while the project is pre-1.0; once we cut a `v1.0.0`, releases will switch back to semver.
