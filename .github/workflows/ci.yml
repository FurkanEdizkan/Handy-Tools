name: CI

# Linux-only CI for the pre-1.0 phase: lint, tests, a 20s fuzz pass, and a
# build assembly check on every push/PR to `main` and `test`.
#
# The earlier multi-OS "compat tier" (ubuntu × macos matrix + a Windows
# compile check + COMPATIBILITY.md generation) was removed while the project
# is small; restoring an OS matrix is tracked for ~v1.0.0 (issue #29).
# Release-time OS coverage still exists via verify-install.yml.
#
# This workflow runs on every push/PR with no path filter — required status
# checks must report on docs-only PRs too, or those PRs can't merge (#93).
#
# Downstream workflows (auto-tag.yml, promote-to-main.yml) key off the
# workflow named "CI" and gate only on its *overall* conclusion.

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate proto bindings
        run: buf generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          args: --timeout=5m

  lint-proto:
    name: Lint (proto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: |
          if [ -d api/proto ]; then
            buf lint
          else
            echo "No proto sources yet, skipping."
          fi

  test-quick:
    name: Test + fuzz (fast lane, Linux)
    needs: [web-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install optional system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            p7zip-full unrar-free poppler-utils imagemagick
      - name: Download web dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
        continue-on-error: true
      - name: Generate proto bindings
        run: buf generate
      - name: Tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum 2>/dev/null; then
            echo "go.mod / go.sum is not tidy. Run 'go mod tidy' and commit." >&2
            exit 1
          fi
      - name: Test
        run: go test -race -count=1 ./...
      - name: Fuzz config YAML decoder (20s)
        run: go test -run=^$ -fuzz=FuzzDecodeYAML -fuzztime=20s ./internal/config

  web-build:
    name: Web (Svelte / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require web/ scaffold
        shell: bash
        run: |
          # The web/ frontend was scaffolded by issue #66; this job now fails
          # loudly so genuine bundler/test regressions break CI (#95). If this
          # assertion ever trips, web/package.json was removed or moved —
          # that is a real problem, not a reason to skip the job.
          if [ ! -f web/package.json ]; then
            echo "::error::web/package.json is missing — the web frontend scaffold is expected to exist." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install + build + test
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # ASSEMBLY
  # ---------------------------------------------------------------------------

  build:
    name: Build
    needs: [lint-go, test-quick, web-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download web dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Generate proto bindings
        run: buf generate
      - name: Build
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/htools  ./cmd/htools
          go build -ldflags="-s -w" -o bin/htoolsd ./cmd/htoolsd
