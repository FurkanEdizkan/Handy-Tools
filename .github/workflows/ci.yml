name: CI

# Linux-hosted CI for the pre-1.0 phase: lint, tests, a 20s fuzz pass, a
# build assembly check, the Wails desktop build, and a compile-only
# darwin/windows cross-build on every push/PR to `main` and `test`.
#
# Tests run on Linux only. The earlier multi-OS "compat tier" (ubuntu × macos
# test matrix + COMPATIBILITY.md generation) was removed while the project is
# small; restoring an OS test matrix is tracked for ~v1.0.0 (issue #29).
# Release-time OS coverage still exists via verify-install.yml.
#
# This workflow runs on every push/PR with no path filter — required status
# checks must report on docs-only PRs too, or those PRs can't merge (#93).
#
# Downstream workflows (auto-tag.yml, promote-to-main.yml) key off the
# workflow named "CI" and gate only on its *overall* conclusion.

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate proto bindings
        run: buf generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  lint-proto:
    name: Lint (proto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: |
          if [ -d api/proto ]; then
            buf lint
          else
            echo "No proto sources yet, skipping."
          fi

  test-quick:
    name: Test + fuzz (fast lane, Linux)
    needs: [web-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install optional system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            p7zip-full unrar-free poppler-utils imagemagick
      - name: Download web dist artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
        continue-on-error: true
      - name: Generate proto bindings
        run: buf generate
      - name: Tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum 2>/dev/null; then
            echo "go.mod / go.sum is not tidy. Run 'go mod tidy' and commit." >&2
            exit 1
          fi
      - name: Test
        run: go test -race -count=1 ./...
      - name: Fuzz config YAML decoder (20s)
        run: go test -run=^$ -fuzz=FuzzDecodeYAML -fuzztime=20s ./internal/config

  web-build:
    name: Web (Svelte / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require web/ scaffold
        shell: bash
        run: |
          # The web/ frontend was scaffolded by issue #66; this job now fails
          # loudly so genuine bundler/test regressions break CI (#95). If this
          # assertion ever trips, web/package.json was removed or moved —
          # that is a real problem, not a reason to skip the job.
          if [ ! -f web/package.json ]; then
            echo "::error::web/package.json is missing — the web frontend scaffold is expected to exist." >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install + build + test
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # ASSEMBLY
  # ---------------------------------------------------------------------------

  build:
    name: Build
    needs: [lint-go, test-quick, web-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download web dist artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Generate proto bindings
        run: buf generate
      - name: Build
        # Every binary the release archive ships (see .goreleaser.yaml).
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/handy      ./cmd/handy
          go build -ldflags="-s -w" -o bin/htools     ./cmd/htools
          go build -ldflags="-s -w" -o bin/htoolsd    ./cmd/htoolsd
          go build -ldflags="-s -w" -o bin/htools-mcp ./cmd/htools-mcp

  # The Wails desktop binary (cmd/htools-gui) needs CGO + the webkit2gtk
  # toolchain, so it builds in its own job rather than forcing those system
  # deps onto every Go job. cmd/htools-gui is gated behind the `wails` build
  # tag — without it a stub stands in, keeping the jobs above CGO-free.
  gui-build:
    name: Build (desktop / Wails)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Wails system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Generate proto bindings
        run: buf generate
      - name: Build htools-gui
        # `production` is required alongside `wails` — without it Wails builds
        # a binary that aborts at startup. The runner is ubuntu-22.04
        # (webkit2gtk-4.0), so `webkit2_40` rather than `webkit2_41` — the same
        # tags as the release's webkit-4.0 GUI (see .goreleaser.yaml).
        run: go build -tags "wails production webkit2_40" -o /tmp/htools-gui ./cmd/htools-gui

  # Compile-only smoke check for the non-Linux release targets. The full
  # test suite stays Linux-only (the project targets Linux primarily, #106);
  # this just catches a build break on darwin/windows cheaply. htools-gui is
  # excluded — it is CGO + webkit, linux-only (see gui-build above).
  compat-build:
    name: Compile check (macOS / Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate proto bindings
        run: buf generate
      - name: Cross-compile handy + htools + htoolsd + htools-mcp
        run: |
          for os in darwin windows; do
            for arch in amd64 arm64; do
              echo "== $os/$arch =="
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build ./cmd/handy ./cmd/htools ./cmd/htoolsd ./cmd/htools-mcp
            done
          done
