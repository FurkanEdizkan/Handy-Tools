name: Auto-tag on version bump

# Fires only after CI on main has completed. This avoids the
# self-wait deadlock we hit with lewagon/wait-on-check-action@v1.3.4 —
# its `running-workflow-name` filter didn't exclude this job's own
# check from the wait set, so the action polled itself forever.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag if version.txt bumped
    runs-on: ubuntu-latest
    # Only proceed when CI succeeded. Manual workflow_dispatch runs
    # always proceed (no upstream conclusion to check).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For workflow_run, the default checkout points at the default
          # branch's HEAD, which can drift past the commit that triggered
          # CI. Pin to the triggering commit so version.txt + the tag
          # describe the same SHA.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(tr -d '[:space:]' < internal/buildinfo/version.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Validate semver
        shell: bash
        run: |
          v='${{ steps.ver.outputs.version }}'
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error file=internal/buildinfo/version.txt::not a semver string: '$v'"
            exit 1
          fi

      - name: Does the tag for this version already exist?
        id: exists
        shell: bash
        run: |
          tag='${{ steps.ver.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — tag already published
        if: steps.exists.outputs.exists == 'true'
        run: |
          echo "Tag ${{ steps.ver.outputs.tag }} already exists; nothing to do."
          echo "Bump internal/buildinfo/version.txt to cut a new release."

      - name: Create and push tag
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.ver.outputs.tag }}'
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "Pushed $tag — release workflow will pick it up."
