name: Auto-tag CI-green commit on main

# Fires after CI on main has completed successfully. Every green CI run
# gets a calver pre-release tag v{YYYY}.{M}.{D}-beta.{N}, where N is one
# more than the highest beta counter already published for today (UTC).
#
# Previous design lived on `push` and used a wait-on-check action to
# block until CI finished — that deadlocked because the action polled
# its own check forever. `workflow_run` is the right primitive: it only
# fires once CI is done, so no wait step is needed.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Compute and push calver tag
    runs-on: ubuntu-latest
    # Only proceed when CI succeeded. workflow_dispatch always proceeds
    # (no upstream conclusion to gate on).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pin to the commit that triggered CI so the tag describes
          # exactly the SHA that went green, even if main has moved on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute next calver tag
        id: ver
        shell: bash
        run: |
          # UTC date keeps cadence deterministic across runners and
          # contributors in different timezones. %-m / %-d are GNU date
          # extensions (no zero padding) so 2026-05-09 → 2026.5.9.
          today=$(date -u +'%Y.%-m.%-d')

          # Refresh tags from origin and find the highest beta counter
          # for today's date, if any.
          git fetch --tags --force origin >/dev/null 2>&1 || true
          existing=$(git tag --list "v${today}-beta.*" \
            | sed -E "s|^v[0-9]+\.[0-9]+\.[0-9]+-beta\.([0-9]+)\$|\1|" \
            | sort -n | tail -1)

          if [ -z "$existing" ]; then
            n=1
          else
            n=$((existing + 1))
          fi
          tag="v${today}-beta.${n}"

          # Belt-and-suspenders: re-check origin in case a parallel run
          # raced us. The concurrency block above should prevent this,
          # but workflow_dispatch + workflow_run can interleave.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists on origin (race with another run?)" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${today}-beta.${n}" >> "$GITHUB_OUTPUT"
          echo "Computed tag: $tag"

      - name: Create and push tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.ver.outputs.tag }}'
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "Pushed $tag — release workflow will pick it up."
