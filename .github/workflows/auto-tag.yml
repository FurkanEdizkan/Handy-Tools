name: Auto-tag on version bump

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag if version.txt bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for CI on main
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          running-workflow-name: 'Auto-tag on version bump'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(tr -d '[:space:]' < internal/buildinfo/version.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Validate semver
        shell: bash
        run: |
          v='${{ steps.ver.outputs.version }}'
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error file=internal/buildinfo/version.txt::not a semver string: '$v'"
            exit 1
          fi

      - name: Did this push change version.txt?
        id: bumped
        shell: bash
        run: |
          before='${{ github.event.before }}'
          # On the very first push to a branch `before` is all-zeros; treat as bumped.
          if [[ "$before" =~ ^0+$ ]] || [ -z "$before" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" -- internal/buildinfo/version.txt | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — version.txt not touched
        if: steps.bumped.outputs.changed != 'true'
        run: echo "version.txt unchanged in this push; nothing to tag."

      - name: Refuse — tag already exists
        if: steps.bumped.outputs.changed == 'true'
        shell: bash
        run: |
          tag='${{ steps.ver.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; bump internal/buildinfo/version.txt to a new value" >&2
            exit 1
          fi

      - name: Create and push tag
        if: steps.bumped.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.ver.outputs.tag }}'
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "Pushed $tag — release workflow will pick it up."
