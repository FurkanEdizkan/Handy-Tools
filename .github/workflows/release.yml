name: Release

# Reusable workflow. Invoked from auto-tag.yml after a calver tag is
# pushed, and manually via workflow_dispatch when re-cutting a release.
#
# We dropped the `push: tags: v*` trigger because tags pushed by
# auto-tag.yml use GITHUB_TOKEN, and GitHub Actions deliberately does
# NOT fire downstream workflows for GITHUB_TOKEN-triggered events
# (prevents runaway recursion). workflow_call sidesteps that limit.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: "The tag to release (e.g. v2026.5.14-beta.3)."
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: "Existing tag to (re)publish a GitHub release for."

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Check out the tag, not main — so {{ .Version }} resolves to
          # the calver value and the binary embeds the right ldflag.
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag is on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tags must be pushed from main; $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify installer against new release
    needs: goreleaser
    # Releases created by GITHUB_TOKEN don't trigger `release: published`
    # workflows (same recursion-prevention rule as tag pushes), so chain
    # the smoke test explicitly here.
    uses: ./.github/workflows/verify-install.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
